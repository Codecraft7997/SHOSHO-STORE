<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SHOSHO STORE | إكسسوارات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#111,#222,#333);
}

header{
background:#000;
padding:20px;
text-align:center;
box-shadow:0 5px 20px #000;
}

header h1{
color:#FFD700;
font-size:30px;
}

.container{
width:90%;
max-width:1000px;
margin:35px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
height:280px;
position:relative;
overflow:hidden;
border-radius:20px;
box-shadow:0 8px 25px #000;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
transition:.4s;
}

.card:hover img{
transform:scale(1.1);
}

.card::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent,#000b);
}

.card a{
position:absolute;
bottom:20px;
right:50%;
transform:translateX(50%);
background:#FFD700;
color:#000;
padding:10px 25px;
border-radius:30px;
font-size:18px;
font-weight:bold;
text-decoration:none;
z-index:2;
}

</style>

</head>

<body>

<header>
<h1>💎 إكسسوارات SHOSHO</h1>
</header>


<div class="container">


<div class="card">

<img src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49">

<a href="men-accessories.html">
🕶️ إكسسوارات رجالي
</a>

</div>



<div class="card">

<img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f">

<a href="girls-accessories.html">
💎 إكسسوارات بناتي
</a>

</div>


</div>


</body>
</html>
