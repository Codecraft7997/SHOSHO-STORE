<title>SHOSHO STORE | إكسسوارات بناتي</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#111,#1b1b1b,#2b2b2b);
}

header{
background:#000;
padding:25px;
text-align:center;
}

header h1{
font-size:40px;
color:#FFD700;
}

.gallery{
width:92%;
max-width:1300px;
margin:35px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.gallery img{
width:100%;
height:330px;
object-fit:cover;
border-radius:20px;
transition:.4s;
box-shadow:0 8px 20px #000;
}

.gallery img:hover{
transform:scale(1.05);
}

.lightbox{
display:none;
position:fixed;
inset:0;
background:#000e;
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:20px;
}

.order{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#25D366;
color:white;
padding:12px 25px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}
</style>

</head>

<script>
let box=document.getElementById("lightbox");
let img=document.getElementById("preview");

document.querySelectorAll(".gallery img").forEach(x=>{
