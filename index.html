<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHAZOZA STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#0f172a,#312e81,#7c3aed,#ec4899);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,.35);
}

.box{
position:relative;
z-index:2;
width:90%;
max-width:500px;
padding:50px 30px;
text-align:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.2);
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
animation:up 1.5s;
}

@keyframes up{
from{
opacity:0;
transform:translateY(80px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
font-size:48px;
font-weight:900;
color:#fff;
letter-spacing:2px;
margin-bottom:15px;
}

span{
color:#ffd54f;
}

p{
color:#eee;
font-size:18px;
margin-bottom:35px;
line-height:1.8;
}

a{
display:inline-block;
padding:15px 45px;
background:linear-gradient(45deg,#ffd54f,#ff9800);
color:#000;
text-decoration:none;
font-size:20px;
font-weight:bold;
border-radius:50px;
transition:.4s;
}

a:hover{
transform:scale(1.08);
box-shadow:0 10px 30px rgba(255,193,7,.5);
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.12);
animation:move 15s linear infinite;
}

.c1{
width:180px;
height:180px;
top:-60px;
left:-60px;
}

.c2{
width:250px;
height:250px;
bottom:-90px;
right:-90px;
animation-duration:20s;
}

@keyframes move{
0%{transform:rotate(0deg) translateY(0);}
50%{transform:rotate(180deg) translateY(20px);}
100%{transform:rotate(360deg) translateY(0);}
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="box">

<h1>SHOSHO <span>STORE</span></h1>

<p>
أحدث صيحات الموضة في مكان واحد.<br>
ملابس • إكسسوارات • أحذية • مستحضرات تجميل • شنط 
</p>

<a href="store.html">ابدأ التسوق</a>

</div>

</body>
</html>
