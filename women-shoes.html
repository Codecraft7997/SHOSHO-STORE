<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#111,#1b1b1b,#2b2b2b);
}

header{
background:#000;
padding:25px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.5);
}

header h1{
font-size:40px;
color:#FFD700;
}

.gallery{
width:92%;
max-width:1300px;
margin:35px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.gallery img{
width:100%;
height:330px;
object-fit:cover;
border-radius:20px;
cursor:pointer;
transition:.4s;
box-shadow:0 8px 20px rgba(0,0,0,.5);
}

.gallery img:hover{
transform:scale(1.05);
box-shadow:0 12px 30px rgba(255,215,0,.3);
}

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.92);
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:20px;
}

.order{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#25D366;
color:#fff;
text-decoration:none;
padding:12px 24px;
font-size:18px;
font-weight:bold;
border-radius:50px;
box-shadow:0 8px 20px rgba(37,211,102,.4);
transition:.3s;
z-index:1000;
}

.order:hover{
background:#1EBE5B;
transform:translateX(-50%) scale(1.05);
}

</style>

</head>

<script>

const lightbox=document.getElementById("lightbox");
const preview=document.getElementById("preview");

document.querySelectorAll(".gallery img").forEach(img=>{
img.onclick=()=>{
preview.src=img.src;
lightbox.style.display="flex";
}
});

lightbox.onclick=()=>{
lightbox.style.display="none";
}

</script>
