<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOSHO STORE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f0f0f;
font-family:Arial,sans-serif;
}

header{
padding:25px;
text-align:center;
background:#000;
}

header h1{
color:#FFD700;
font-size:38px;
letter-spacing:2px;
}

.gallery{
width:92%;
max-width:1300px;
margin:35px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.gallery img{
width:100%;
height:330px;
object-fit:cover;
border-radius:22px;
cursor:pointer;
transition:.4s;
box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.gallery img:nth-child(3n){
height:420px;
}

.gallery img:nth-child(5n){
height:270px;
}

.gallery img:hover{
transform:scale(1.05) rotate(1deg);
box-shadow:0 15px 35px rgba(255,215,0,.35);
}

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.92);
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:20px;
}

.order{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#25D366;
color:#fff;
text-decoration:none;
padding:16px 35px;
border-radius:50px;
font-size:22px;
font-weight:bold;
box-shadow:0 10px 30px rgba(37,211,102,.4);
transition:.3s;
}

.order:hover{
transform:translateX(-50%) scale(1.08);
}
</style>
</head>

<script>
const lightbox=document.getElementById("lightbox");
const preview=document.getElementById("preview");

document.querySelectorAll(".gallery img").forEach(img=>{
