<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAZOZA STORE - Shoes</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#111,#1c1c1c,#333);
padding:40px 20px;
}

.title{
text-align:center;
font-size:45px;
color:#FFD700;
margin-bottom:40px;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.card{
position:relative;
height:460px;
overflow:hidden;
border-radius:25px;
text-decoration:none;
box-shadow:0 15px 35px rgba(0,0,0,.5);
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.card:hover img{
transform:scale(1.08);
}

.overlay{
position:absolute;
left:0;
right:0;
bottom:0;
padding:30px;
background:linear-gradient(transparent,rgba(0,0,0,.9));
display:flex;
justify-content:center;
}

.overlay h2{
color:#fff;
font-size:34px;
background:rgba(255,255,255,.15);
padding:12px 35px;
border-radius:50px;
backdrop-filter:blur(8px);
}
</style>

</head>

<body>

<h1 class="title">👟 قسم الأحذية</h1>

<div class="container">

<a href="men-shoes.html" class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900" alt="رجالي">
<div class="overlay">
<h2>👞 رجالي</h2>
</div>
</a>

<a href="women-shoes.html" class="card">
<img src="https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=900" alt="بناتي">
<div class="overlay">
<h2>👠 بناتي</h2>
</div>
</a>

<a href="kids-shoes.html" class="card">
<img src="https://images.unsplash.com/photo-1514989940723-e8e51635b782?w=900" alt="أطفال">
<div class="overlay">
<h2>👟 أطفال</h2>
</div>
</a>

</div>

</body>
</html>
