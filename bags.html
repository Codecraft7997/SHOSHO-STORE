<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOSHO STORE - Bags</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#111,#1f1f1f,#333);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:90%;
max-width:1000px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}

.card{
position:relative;
height:450px;
border-radius:25px;
overflow:hidden;
text-decoration:none;
box-shadow:0 15px 35px rgba(0,0,0,.5);
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.card:hover img{
transform:scale(1.1);
}

.overlay{
position:absolute;
left:0;
right:0;
bottom:0;
padding:30px;
background:linear-gradient(transparent,rgba(0,0,0,.9));
display:flex;
justify-content:center;
}

.overlay h2{
color:#fff;
font-size:34px;
background:rgba(255,255,255,.15);
padding:12px 35px;
border-radius:50px;
backdrop-filter:blur(8px);
}

</style>

</head>

<body>

<div class="container">

<a href="girls-bags.html" class="card">
<img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=900" alt="">
<div class="overlay">
<h2>👜 شنط بناتي</h2>
</div>
</a>

<a href="school-bags.html" class="card">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900" alt="">
<div class="overlay">
<h2>🎒 شنط مدارس</h2>
</div>
</a>

</div>

</body>
</html>
